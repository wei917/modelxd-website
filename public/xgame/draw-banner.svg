<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240">
  <!-- Draw & Guess banner: two easels, same secret subject, one question. -->
  <rect width="640" height="240" fill="#f5efe4"/>
  <!-- left easel -->
  <g stroke="#8a6a3d" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="120" y1="60" x2="90" y2="215"/>
    <line x1="200" y1="60" x2="230" y2="215"/>
    <line x1="160" y1="80" x2="160" y2="215"/>
  </g>
  <rect x="85" y="50" width="150" height="110" rx="6" fill="#ffffff" stroke="#2a2a2a" stroke-width="4"/>
  <!-- a cat doodle -->
  <g stroke="#2a2a2a" stroke-width="4" fill="none" stroke-linecap="round">
    <circle cx="160" cy="112" r="26"/>
    <path d="M141 94 l-8 -16 l16 6"/>
    <path d="M179 94 l8 -16 l-16 6"/>
    <circle cx="151" cy="108" r="2.4" fill="#2a2a2a"/>
    <circle cx="169" cy="108" r="2.4" fill="#2a2a2a"/>
    <path d="M153 122 q7 6 14 0"/>
    <path d="M132 114 l-14 -3 M132 120 l-14 3 M188 114 l14 -3 M188 120 l14 3" stroke-width="2.6"/>
  </g>
  <!-- right easel -->
  <g stroke="#8a6a3d" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="420" y1="60" x2="390" y2="215"/>
    <line x1="500" y1="60" x2="530" y2="215"/>
    <line x1="460" y1="80" x2="460" y2="215"/>
  </g>
  <rect x="385" y="50" width="150" height="110" rx="6" fill="#ffffff" stroke="#2a2a2a" stroke-width="4"/>
  <!-- a much worse cat doodle -->
  <g stroke="#2a2a2a" stroke-width="4" fill="none" stroke-linecap="round">
    <ellipse cx="460" cy="115" rx="30" ry="20"/>
    <path d="M438 100 l-4 -14 l12 8"/>
    <path d="M482 100 l4 -14 l-12 8"/>
    <circle cx="452" cy="112" r="2.4" fill="#2a2a2a"/>
    <circle cx="468" cy="110" r="2.4" fill="#2a2a2a"/>
    <path d="M452 124 q8 4 16 -2"/>
  </g>
  <!-- the question between them -->
  <g font-family="Archivo Black, Arial Black, sans-serif" text-anchor="middle">
    <text x="320" y="130" font-size="64" fill="#e8453c">?</text>
    <text x="320" y="170" font-size="15" fill="#8a6a3d">A vs B</text>
  </g>
  <!-- floating guess bubbles -->
  <g fill="#ffffff" stroke="#2a2a2a" stroke-width="3">
    <rect x="255" y="38" width="130" height="34" rx="17"/>
  </g>
  <g font-family="JetBrains Mono, monospace" font-size="15" fill="#2a2a2a" text-anchor="middle">
    <text x="320" y="60">・・・？</text>
  </g>
</svg>
