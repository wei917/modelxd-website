<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240">
  <!-- XGame 象棋 banner (Oct 20). Drawn in code like the other XGame banners:
       a corner of the board around the river, and a few pieces. The square
       XGameBar cuts from its centre shows the central cannon facing the general. -->
  <defs>
    <radialGradient id="xqglow"><stop offset="0" stop-color="#ff2a1a" stop-opacity="0.85"/><stop offset="0.55" stop-color="#e8261a" stop-opacity="0.35"/><stop offset="1" stop-color="#e8261a" stop-opacity="0"/></radialGradient>
    <filter id="xqshadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.28"/></filter>
  </defs>
  <rect width="640" height="240" fill="#e9c992"/>
  <g stroke="#7a5530" stroke-width="2">
    <line x1="0" y1="20" x2="640" y2="20"/><line x1="0" y1="70" x2="640" y2="70"/>
    <line x1="0" y1="170" x2="640" y2="170"/><line x1="0" y1="220" x2="640" y2="220"/>
    <line x1="20" y1="0" x2="20" y2="240"/><line x1="620" y1="0" x2="620" y2="240"/>
    <line x1="70" y1="0" x2="70" y2="70"/><line x1="120" y1="0" x2="120" y2="70"/><line x1="170" y1="0" x2="170" y2="70"/>
    <line x1="220" y1="0" x2="220" y2="70"/><line x1="270" y1="0" x2="270" y2="70"/><line x1="320" y1="0" x2="320" y2="70"/>
    <line x1="370" y1="0" x2="370" y2="70"/><line x1="420" y1="0" x2="420" y2="70"/><line x1="470" y1="0" x2="470" y2="70"/>
    <line x1="520" y1="0" x2="520" y2="70"/><line x1="570" y1="0" x2="570" y2="70"/>
    <line x1="70" y1="170" x2="70" y2="240"/><line x1="120" y1="170" x2="120" y2="240"/><line x1="170" y1="170" x2="170" y2="240"/>
    <line x1="220" y1="170" x2="220" y2="240"/><line x1="270" y1="170" x2="270" y2="240"/><line x1="320" y1="170" x2="320" y2="240"/>
    <line x1="370" y1="170" x2="370" y2="240"/><line x1="420" y1="170" x2="420" y2="240"/><line x1="470" y1="170" x2="470" y2="240"/>
    <line x1="520" y1="170" x2="520" y2="240"/><line x1="570" y1="170" x2="570" y2="240"/>
  </g>
  <g font-family="'Noto Serif TC','Songti TC','PingFang TC',serif" font-size="40" fill="#7a5530" opacity="0.85" text-anchor="middle" dominant-baseline="central" letter-spacing="10">
    <text x="150" y="120">楚 河</text><text x="490" y="120">漢 界</text>
  </g>
  <circle cx="320" cy="70" r="30" fill="url(#xqglow)"/>
  <g font-family="'Noto Sans TC','PingFang TC',sans-serif" font-weight="700" font-size="30" text-anchor="middle" dominant-baseline="central" filter="url(#xqshadow)">
    <g transform="translate(320 70)"><circle r="23" fill="#f7ead0" stroke="#1d1b19" stroke-width="2.2"/><circle r="19" fill="none" stroke="#1d1b19" stroke-width="1"/><text y="1" fill="#1d1b19">將</text></g>
    <g transform="translate(170 20)"><circle r="23" fill="#f7ead0" stroke="#1d1b19" stroke-width="2.2"/><circle r="19" fill="none" stroke="#1d1b19" stroke-width="1"/><text y="1" fill="#1d1b19">馬</text></g>
    <g transform="translate(520 20)"><circle r="23" fill="#f7ead0" stroke="#1d1b19" stroke-width="2.2"/><circle r="19" fill="none" stroke="#1d1b19" stroke-width="1"/><text y="1" fill="#1d1b19">車</text></g>
    <g transform="translate(320 170)"><circle r="23" fill="#f7ead0" stroke="#c0392b" stroke-width="2.2"/><circle r="19" fill="none" stroke="#c0392b" stroke-width="1"/><text y="1" fill="#c0392b">炮</text></g>
    <g transform="translate(120 220)"><circle r="23" fill="#f7ead0" stroke="#c0392b" stroke-width="2.2"/><circle r="19" fill="none" stroke="#c0392b" stroke-width="1"/><text y="1" fill="#c0392b">俥</text></g>
    <g transform="translate(470 170)"><circle r="23" fill="#f7ead0" stroke="#c0392b" stroke-width="2.2"/><circle r="19" fill="none" stroke="#c0392b" stroke-width="1"/><text y="1" fill="#c0392b">傌</text></g>
  </g>
</svg>
