<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- XGame bridge's icon in the top bar (Oct 20): four cards fanned on the
       felt, one per suit, big enough to read at 30-40 px. Drawn in code like
       the other XGame art, until approved icons exist. -->
  <rect width="120" height="120" fill="#2f6b4f"/>
  <g font-family="'Noto Sans TC','PingFang TC','Hiragino Sans',sans-serif" font-weight="800" text-anchor="middle" dominant-baseline="central">
    <g transform="translate(60 70) rotate(-27) translate(0 -26)"><rect x="-17" y="-24" width="34" height="48" rx="5" fill="#fbf8f1" stroke="#1d1b19" stroke-width="1.5"/><text y="0" font-size="26" fill="#1d1b19">♣</text></g>
    <g transform="translate(60 70) rotate(-9) translate(0 -26)"><rect x="-17" y="-24" width="34" height="48" rx="5" fill="#fbf8f1" stroke="#1d1b19" stroke-width="1.5"/><text y="0" font-size="26" fill="#c0392b">♦</text></g>
    <g transform="translate(60 70) rotate(9) translate(0 -26)"><rect x="-17" y="-24" width="34" height="48" rx="5" fill="#fbf8f1" stroke="#1d1b19" stroke-width="1.5"/><text y="0" font-size="26" fill="#c0392b">♥</text></g>
    <g transform="translate(60 70) rotate(27) translate(0 -26)"><rect x="-17" y="-24" width="34" height="48" rx="5" fill="#fbf8f1" stroke="#1d1b19" stroke-width="1.5"/><text y="0" font-size="26" fill="#1d1b19">♠</text></g>
  </g>
</svg>
